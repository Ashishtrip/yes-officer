services:
  db:
    image: postgres:15-alpine
    container_name: pragati-postgres
    environment:
      POSTGRES_USER: pragati_user
      POSTGRES_PASSWORD: pragati_password
      POSTGRES_DB: pragati_db
    ports:
      - "5433:5432"
    volumes:
      - pragati-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: pragati-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio
    container_name: pragati-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - pragati-minio-data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  create-minio-bucket:
    image: quay.io/minio/mc
    container_name: pragati-minio-mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/bidder-documents --ignore-existing;
      /usr/bin/mc policy set public myminio/bidder-documents;
      exit 0;
      "

volumes:
  pragati-pgdata:
  pragati-minio-data:
